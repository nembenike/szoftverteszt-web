<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tron | Szoftverteszt Web</title>
    <style>
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;background:#000}
      .tron-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
      canvas{background:#000;border:4px solid #07111f;border-radius:8px}
      .hud{color:#cfefff;font-family:monospace;text-align:center}
      .controls{color:#9bd6ff;font-size:13px;margin-top:6px}
      .btn{background:#06202b;color:#bdefff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
    </style>
  </head>
  <body>
    <div class="tron-wrap">
      <div class="hud">
        <div style="display:flex;gap:16px;align-items:center;justify-content:center">
          <div id="score" style="min-width:160px">P1: 0 • P2: 0</div>
          <div id="status">Press Enter to start — Player 1: Arrows, Player 2: WASD</div>
        </div>
        <div class="controls">Restart: Space • Pause: P</div>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:center">
          <button id="aiToggle" class="btn">Enable AI</button>
          <a href="/" class="btn" style="display:inline-block;line-height:24px;text-align:center;">Back to site</a>
        </div>
      </div>
      <canvas id="tron" width="640" height="640"></canvas>
      <div>
        <button id="restart" class="btn">Restart</button>
      </div>
    </div>
    <script type="module" src="/src/tron.js"></script>
  </body>
</html>
